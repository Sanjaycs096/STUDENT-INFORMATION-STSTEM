<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Delete Student</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        *, *:after, *:before {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            line-height: 1.5;
            margin: 0;
            display: flex;
            min-height: 100vh;
            background: url('#') no-repeat center center fixed;
            background-size: cover;
        }

        ul {
            list-style: none;
            margin: 0;
            padding: 0.75rem;
            background-color: #05043e;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            width: 80px;
            position: fixed;
            top: 0;
            left: 0;
            box-shadow: 0 10px 50px 0 rgba(5, 4, 62, .25);
        }

        li:nth-child(7) {
            margin-top: 5rem;
            padding-top: 1.25rem;
            border-top: 1px solid #363664;
        }

        li + li {
            margin-top: .75rem;
        }

        a {
            color: #FFF;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 3rem;
            border-radius: 8px;
            position: relative;
        }

        a:hover, a:focus, a.active {
            background-color: #30305a;
            outline: 0;
        }

        a i {
            font-size: 1.5rem;
            display: block;
            text-align: center;
        }

        a span {
            position: absolute;
            background-color: #30305a;
            white-space: nowrap;
            padding: .5rem 1rem;
            border-radius: 6px;
            left: calc(100% + 1rem);
            transform-origin: left;
            transform: scale(0);
            opacity: 0;
            transition: .15s ease;
            color: #fff;
            z-index: 10;
        }

        a:hover span {
            transform: scale(1);
            opacity: 1;
        }

        .container {
            margin-left: 100px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn {
            background-color: #dc3545;
            color: white;
            padding: 12px 24px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            border-radius: 10px;
            display: block;
            margin: 20px auto;
        }

        .btn:hover {
            background-color: #c82333;
        }

        .success-message {
            color: green;
            margin-top: 10px;
            text-align: center;
        }

        .error-message {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<ul>
    <li><a href="/admin.html"><i class="fas fa-home"></i><span>Dashboard</span></a></li>
    <li><a href="/edit.html"><i class="fas fa-edit"></i><span>Edit</span></a></li>
    <li><a href="/delete.html" class="active"><i class="fas fa-trash"></i><span>Delete</span></a></li>
    <li><a href="/student_list.html"><i class="fas fa-eye"></i><span>View</span></a></li>
    <li><a href="/attendance.html"><i class="fas fa-calendar"></i><span>Attendance</span></a></li>
    <li><a href="/marks.html"><i class="fas fa-chart-line"></i><span>Scores</span></a></li>
    <li><a href="/logout.html"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a></li>
</ul>

<div class="container">
    <h2>Delete Student</h2>
    <p style="color: #666;">Enter the register number and DOB to delete a student record.</p>
    
    <form id="deleteForm">
        <label for="register_number">Register Number:</label>
        <input type="text" name="register_number" id="register_number" required>

        <label for="dob">Date of Birth (YYYYMMDD):</label>
        <input type="text" name="dob" id="dob" pattern="\d{8}" placeholder="YYYYMMDD" required>

        <button type="submit" class="btn">Delete Student</button>
    </form>

    <p class="success-message" id="successMessage"></p>
    <p class="error-message" id="errorMessage"></p>
</div>

<script>
document.getElementById('deleteForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    if (!confirm('Are you sure you want to delete this student? This action cannot be undone.')) {
        return;
    }
    
    const formData = new FormData(this);
    formData.append('_csrf_token', document.querySelector('meta[name="csrf-token"]').content);
    
    try {
        const response = await fetch('/delete.php', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
            document.getElementById('successMessage').textContent = result.message || 'Student deleted successfully!';
            document.getElementById('errorMessage').textContent = '';
            document.getElementById('deleteForm').reset();
        } else {
            document.getElementById('errorMessage').textContent = result.message || 'Error deleting student';
            document.getElementById('successMessage').textContent = '';
        }
    } catch (error) {
        document.getElementById('errorMessage').textContent = 'Error: ' + error.message;
        document.getElementById('successMessage').textContent = '';
    }
});
</script>
</body>
</html>
