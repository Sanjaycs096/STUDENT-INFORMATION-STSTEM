<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <style>
    :root {
      --primary: 237, 94%, 81%;
      --background: 266, 16%, 92%;
      --background-secondary: 256, 12%, 12%;
      --background-secondary-dark: 256, 10%, 10%;
      --background-secondary-light: 257, 11%, 16%;
      --text-primary: 0, 0%, 0%;
      --white: 0, 0%, 100%;
      --quite-gray: 0, 0%, 70%;
      --font-main: "Poppins", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-main); background-color: hsl(var(--background)); color: hsl(var(--text-primary)); display: flex; }
    #navbar { position: fixed; top: 0; left: 0; width: 5rem; height: 100vh; background-color: hsl(var(--background-secondary)); transition: width 0.3s ease-in-out; overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column; justify-content: space-between; }
    #navbar:hover { width: 16rem; }
    .navbar-items { list-style: none; padding: 0; }
    .navbar-logo { height: 5rem; background-color: hsl(var(--background-secondary-dark)); display: flex; justify-content: left; align-items: center; }
    .navbar-logo svg { height: 2rem; fill: hsl(var(--white)); }
    .navbar-item-inner ion-icon { min-width: 2rem; color: hsl(var(--quite-gray)); }
    #navbar:hover .navbar-item-inner ion-icon { color: hsl(var(--white)); }
    .navbar-item-inner { display: flex; align-items: center; gap: 1rem; color: hsl(var(--quite-gray)); padding: 1rem; text-decoration: none; transition: background 0.3s, color 0.3s; white-space: nowrap; overflow: hidden; }
    .navbar-item-inner:hover { background-color: hsl(var(--background-secondary-light)); color: hsl(var(--white)); }
    .link-text { white-space: nowrap; opacity: 0; transition: opacity 0.3s; }
    #navbar:hover .link-text { opacity: 1; }
    ion-icon { font-size: 1.5rem; }
    main#main { margin-left: 5rem; padding: 2rem; width: 100%; transition: margin-left 0.3s ease-in-out; }
    #navbar:hover ~ main#main { margin-left: 16rem; }
    .info-box { background: white; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 800px; }
    .info-box h3 { margin-bottom: 15px; color: #333; }
    .info-box table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .info-box table tr td { padding: 8px; border-bottom: 1px solid #eee; }
    .info-box table tr td:first-child { font-weight: 600; color: #666; width: 200px; }
    .info-box table tr td:last-child { color: #222; }
    .download-btn { background: #4CAF50; color: white; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; display: inline-flex; align-items: center; gap: 8px; transition: background 0.3s; text-decoration: none; }
    .download-btn:hover { background: #45a049; }
    .download-btn ion-icon { font-size: 20px; }
  </style>
</head>
<body>
  <nav id="navbar">
    <ul class="navbar-items">
      <li class="navbar-logo">
        <a class="navbar-item-inner">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1438.88 1819.54">
            <polygon points="925.79 318.48 830.56 0 183.51 1384.12 510.41 1178.46 925.79 318.48"/>
            <polygon points="1438.88 1663.28 1126.35 948.08 111.98 1586.26 0 1819.54 1020.91 1250.57 1123.78 1471.02 783.64 1663.28 1438.88 1663.28"/>
          </svg>
        </a>
      </li>
      <li><a class="navbar-item-inner" href="/student_index.html"><ion-icon name="grid-outline"></ion-icon><span class="link-text">Dashboard</span></a></li>
      <li><a class="navbar-item-inner" href="/student_dashboard.html"><ion-icon name="person-outline"></ion-icon><span class="link-text">Profile</span></a></li>
      <li><a class="navbar-item-inner" href="/performance.html"><ion-icon name="stats-chart-outline"></ion-icon><span class="link-text">Performance</span></a></li>
      <li><a class="navbar-item-inner" href="/academic_details.html"><ion-icon name="school-outline"></ion-icon><span class="link-text">Exam Details</span></a></li>
      <li><a class="navbar-item-inner" href="/change_password.html"><ion-icon name="lock-closed-outline"></ion-icon><span class="link-text">Change Password</span></a></li>
    </ul>
    <ul class="navbar-items">
      <li><a class="navbar-item-inner" href="/logout.html"><ion-icon name="log-out-outline"></ion-icon><span class="link-text">Logout</span></a></li>
    </ul>
  </nav>
  <main id="main">
    <div class="info-box">
      <h3>Student Profile</h3>
      <div id="profileContent"></div>
      <a href="#" class="download-btn" id="downloadBtn" style="display:none;" onclick="downloadReport(event)">
        <ion-icon name="download-outline"></ion-icon>
        Download Full Report (PDF)
      </a>
    </div>
  </main>
  <script>
    let studentRegisterNumber = null;

    async function downloadReport(event) {
      event.preventDefault();
      
      try {
        const response = await fetch(`/api/download-report/${studentRegisterNumber}`);
        
        if (!response.ok) {
          alert('📄 PDF Report Feature\n\nThis feature is currently disabled.\n\nTo enable PDF downloads:\n1. Install reportlab: pip install reportlab\n2. Contact your administrator\n\nThank you!');
          return;
        }
        
        // If successful, download the file
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Student_Report_${studentRegisterNumber}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      } catch (error) {
        alert('Error downloading report. Please try again later.');
      }
    }

    async function loadProfile() {
      try {
        const response = await fetch('/student_dashboard.php?action=fetch');
        const data = await response.json();
        const contentDiv = document.getElementById('profileContent');
        
        if (data.student) {
          const s = data.student;
          contentDiv.innerHTML = `
            <table>
              <tr><td>Name</td><td>${s.student_name}</td></tr>
              <tr><td>Register Number</td><td>${data.register_number}</td></tr>
              <tr><td>Department</td><td>${s.department}</td></tr>
              <tr><td>Date of Birth</td><td>${s.dob}</td></tr>
              <tr><td>Father's Name</td><td>${s.father_name}</td></tr>
              <tr><td>Mother's Name</td><td>${s.mother_name}</td></tr>
              <tr><td>Blood Group</td><td>${s.blood_group}</td></tr>
              <tr><td>Gender</td><td>${s.gender}</td></tr>
              <tr><td>Address</td><td>${s.address}</td></tr>
            </table>
          `;
          
          // Store register number and show download button
          studentRegisterNumber = data.register_number;
          const downloadBtn = document.getElementById('downloadBtn');
          downloadBtn.style.display = 'inline-flex';
        } else {
          contentDiv.innerHTML = '<p>Student details not found.</p>';
        }
      } catch (error) {
        document.getElementById('profileContent').innerHTML = '<p class="error">Error loading profile: ' + error.message + '</p>';
      }
    }
    loadProfile();
  </script>
</body>
</html>
