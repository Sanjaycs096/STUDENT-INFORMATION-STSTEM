<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} – {{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05043e;
            overflow: hidden;
            position: relative;
        }

        /* animated floating particles */
        .particles {
            position: absolute;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .particles span {
            position: absolute;
            display: block;
            border-radius: 50%;
            opacity: 0.15;
            animation: float 8s infinite linear;
        }
        @keyframes float {
            0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0;    }
            10%  { opacity: 0.15; }
            90%  { opacity: 0.15; }
            100% { transform: translateY(-10vh) rotate(720deg); opacity: 0;    }
        }

        /* card */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 60px 56px 52px;
            text-align: center;
            max-width: 520px;
            width: 90%;
            backdrop-filter: blur(12px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
        }

        .icon-wrap {
            width: 88px; height: 88px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            border: 2px solid rgba(255,255,255,0.12);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 28px;
        }
        .icon-wrap i {
            font-size: 36px;
            color: {{ icon_color }};
        }

        .code {
            font-size: 96px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -4px;
            background: linear-gradient(135deg, {{ gradient_a }}, {{ gradient_b }});
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .message {
            font-size: 14px;
            color: rgba(255,255,255,0.55);
            line-height: 1.7;
            margin-bottom: 36px;
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: transform .15s, box-shadow .15s;
            cursor: pointer;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

        .btn-primary {
            background: linear-gradient(135deg, {{ gradient_a }}, {{ gradient_b }});
            color: #fff;
            border: none;
        }
        .btn-ghost {
            background: transparent;
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-ghost:hover { color: #fff; border-color: rgba(255,255,255,0.5); }

        .divider {
            width: 48px; height: 3px;
            background: linear-gradient(90deg, {{ gradient_a }}, {{ gradient_b }});
            border-radius: 99px;
            margin: 0 auto 28px;
        }
    </style>
</head>
<body>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <div class="card">
        <div class="icon-wrap">
            <i class="{{ icon }}"></i>
        </div>

        <div class="code">{{ code }}</div>
        <div class="divider"></div>
        <div class="title">{{ title }}</div>
        <div class="message">{{ message }}</div>

        <div class="actions">
            <a href="javascript:history.back()" class="btn btn-ghost">
                <i class="fas fa-arrow-left"></i> Go Back
            </a>
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> Home
            </a>
        </div>
    </div>

    <script>
        const colors = ['#6c63ff','#00cfff','#ff5fa0','#ffd166','#06d6a0'];
        const container = document.getElementById('particles');
        for (let i = 0; i < 22; i++) {
            const s = document.createElement('span');
            const size = Math.random() * 60 + 20;
            s.style.cssText = `
                width:${size}px; height:${size}px;
                left:${Math.random()*100}%;
                animation-delay:${Math.random()*8}s;
                animation-duration:${Math.random()*6+6}s;
                background:${colors[Math.floor(Math.random()*colors.length)]};
            `;
            container.appendChild(s);
        }
    </script>
</body>
</html>
