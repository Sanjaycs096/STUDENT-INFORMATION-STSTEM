    #navbar:hover { width: 16rem; }
    .navbar-items { list-style: none; padding: 0; }
    .navbar-logo { height: 5rem; background-color: hsl(var(--background-secondary-dark)); display: flex; justify-content: left; align-items: center; }
    .navbar-logo svg { height: 2rem; fill: hsl(var(--white)); }
    .navbar-item-inner ion-icon { min-width: 2rem; color: hsl(var(--quite-gray)); }
    #navbar:hover .navbar-item-inner ion-icon { color: hsl(var(--white)); }
    .navbar-item-inner { display: flex; align-items: center; gap: 1rem; color: hsl(var(--quite-gray)); padding: 1rem; text-decoration: none; transition: background 0.3s, color 0.3s; white-space: nowrap; overflow: hidden; }
    .navbar-item-inner:hover { background-color: hsl(var(--background-secondary-light)); color: hsl(var(--white)); }
    .link-text { white-space: nowrap; opacity: 0; transition: opacity 0.3s; }
    #navbar:hover .link-text { opacity: 1; }
    ion-icon { font-size: 1.5rem; }
    main#main { margin-left: 5rem; padding: 2rem; width: 100%; transition: margin-left 0.3s ease-in-out; }
    #navbar:hover ~ main#main { margin-left: 16rem; }
    .notification-item { background: white; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
    .notification-item:hover { transform: translateX(5px); }
    .notification-item.unread { border-left: 4px solid #ff5f5f; }
    .notification-title { font-weight: 600; font-size: 16px; margin-bottom: 5px; color: #333; }
    .notification-message { color: #666; font-size: 14px; margin-bottom: 8px; }
    .notification-time { color: #999; font-size: 12px; }
    .mark-all-read { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
    .mark-all-read:hover { background: #45a049; }
    .no-notifications { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <nav id="navbar">

      <li class="navbar-logo">

  <main id="main">
    <h2>Notifications</h2>
    <button class="mark-all-read" id="markAllRead" style="display:none;">Mark All as Read</button>
    <div id="notificationsList"></div>
  </main>

  <script>
    async function loadNotifications() {
      try {
        const response = await fetch('/api/notifications');
        const data = await response.json();
        
        if (data.success && data.notifications.length > 0) {
          const listDiv = document.getElementById('notificationsList');
          const hasUnread = data.notifications.some(n => !n.is_read);
          
          if (hasUnread) {
            document.getElementById('markAllRead').style.display = 'block';
          }
          
          listDiv.innerHTML = data.notifications.map(notif => {
            const date = new Date(notif.created_at).toLocaleString();
            const unreadClass = notif.is_read ? '' : 'unread';
            return `
              <div class="notification-item ${unreadClass}" onclick="markAsRead('${notif.id}')">
                <div class="notification-title">${notif.title}</div>
                <div class="notification-message">${notif.message}</div>
                <div class="notification-time">${date}</div>
              </div>
            `;
          }).join('');
        } else {
          document.getElementById('notificationsList').innerHTML = '<div class="no-notifications">No notifications</div>';
        }
      } catch (error) {
        document.getElementById('notificationsList').innerHTML = '<div class="no-notifications">Error loading notifications</div>';
      }
    }

    async function markAsRead(id) {
      try {
        await fetch(`/api/notifications/${id}/read`, { method: 'POST' });
        loadNotifications();
      } catch (error) {
        console.error('Error marking notification as read:', error);
      }
    }

    document.getElementById('markAllRead').addEventListener('click', async () => {
      try {
        await fetch('/api/notifications/mark-all-read', { method: 'POST' });
        loadNotifications();
      } catch (error) {
        console.error('Error marking all as read:', error);
      }
    });

    loadNotifications();
  </script>
</body>
</html>
