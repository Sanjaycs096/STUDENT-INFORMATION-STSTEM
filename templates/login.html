<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #181818;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        section {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
        }

        section span {
            position: absolute;
            display: block;
            width: calc(6.25vw - 2px);
            height: calc(6.25vw - 2px);
            background: rgba(255, 255, 255, 0.1);
            z-index: 1;
            animation: floatAnimation 6s infinite linear;
        }

        @keyframes floatAnimation {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        section span:nth-child(odd) {
            animation-duration: 5s;
            background: rgba(255, 0, 0, 0.3);
        }

        section span:nth-child(even) {
            animation-duration: 7s;
            background: rgba(0, 255, 255, 0.3);
        }

        /* Login Box */
        .signin {
            position: relative;
            width: 370px;
            min-height: 400px;
            background: rgba(28, 28, 28, 0.9);
            border-radius: 50px 5px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            z-index: 2;
            text-align: center;
        }

        h2 {
            color: #fff;
            margin-bottom: 20px;
        }

        .input-box {
            position: relative;
            margin: 20px 0;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #fff;
            outline: none;
            color: #fff;
            font-size: 16px;
        }

        .input-box span {
            position: absolute;
            left: 0;
            top: 10px;
            color: #aaa;
            transition: 0.3s;
            pointer-events: none;
        }

        .input-box input:focus + span,
        .input-box input:valid + span {
            top: -15px;
            font-size: 12px;
            color: #fff;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            background: #ff5f5f;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #ff3030;
        }

        .links {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .links a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            margin: 0 10px;
            transition: 0.3s;
        }

        .links a:hover {
            color: #ff5f5f;
        }

        .alert {
            background: rgba(255, 0, 0, 0.2);
            color: #ff5f5f;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            border: 1px solid #ff5f5f;
        }

        /* Demo Credentials Box */
        .demo-box {
            margin-top: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 14px 16px;
            text-align: left;
        }

        .demo-box h4 {
            color: #ff5f5f;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .demo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            font-size: 12px;
        }

        .demo-row .label {
            color: #aaa;
            font-weight: 600;
            min-width: 55px;
        }

        .demo-row .cred {
            color: #fff;
            font-family: monospace;
            font-size: 12px;
        }

        .demo-row .cred span {
            color: #7ec8e3;
        }

        .demo-fill-btn {
            background: none;
            border: 1px solid rgba(255, 95, 95, 0.5);
            color: #ff5f5f;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        .demo-fill-btn:hover {
            background: rgba(255, 95, 95, 0.2);
        }

        .demo-section-title {
            color: #aaa;
            font-size: 11px;
            font-weight: 600;
            margin: 8px 0 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <!-- Animated Background -->
    <section id="animatedBg"></section>

    <div class="signin">
        <h2 id="formTitle">Student Login</h2>
        
        <div class="links">
            <a href="#" onclick="showForm('student')">Student</a> |
            <a href="#" onclick="showForm('faculty')">Faculty</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="alert">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Common Form -->
        <form method="post">
            <input type="hidden" name="userType" id="userType" value="student">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <div class="input-box">
                <input type="text" name="registerNumber" required>
                <span id="labelText">Register Number</span>
            </div>
            <div class="input-box">
                <input type="password" name="password" required>
                <span>Password</span>
            </div>
            <button class="btn" type="submit">Login</button>
        </form>

        <!-- Demo Credentials -->
        <div class="demo-box">
            <h4>🔑 Demo Login</h4>

            <div class="demo-section-title">Student</div>
            <div class="demo-row">
                <span class="label">Reg No</span>
                <span class="cred"><span>DEMO001</span></span>
                <button class="demo-fill-btn" onclick="fillCredentials('student','DEMO001','demo001')">Fill</button>
            </div>
            <div class="demo-row">
                <span class="label">Password</span>
                <span class="cred"><span>demo001</span></span>
            </div>
        </div>
    </div>

    <script>
        // Create animated background particles
        const animatedBg = document.getElementById('animatedBg');
        for (let i = 0; i < 30; i++) {
            let span = document.createElement("span");
            let size = Math.random() * 80 + 20;
            span.style.width = size + "px";
            span.style.height = size + "px";
            span.style.left = Math.random() * window.innerWidth + "px";
            span.style.top = Math.random() * window.innerHeight + "px";
            span.style.animationDuration = Math.random() * 5 + 3 + "s";
            animatedBg.appendChild(span);
        }

        function showForm(type) {
            document.getElementById("userType").value = type;
            document.getElementById("formTitle").textContent = type === "faculty" ? "Faculty Login" : "Student Login";
            document.getElementById("labelText").textContent = type === "faculty" ? "Faculty ID" : "Register Number";
        }

        function fillCredentials(type, id, pass) {
            showForm(type);
            const inputs = document.querySelectorAll('.input-box input');
            inputs[0].value = id;
            inputs[1].value = pass;
        }
    </script>

</body>

</html>
